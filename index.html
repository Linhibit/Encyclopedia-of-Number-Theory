<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数论百科 | Encyclopedia of Number Theory</title>
    <link rel="stylesheet" href="style.css">
    <script>
    window.MathJax = {
        tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)']],
            displayMath: [['$$', '$$'], ['\\[', '\\]']]
        },
        options: {
            processHtmlClass: 'theorem-card'
        }
    };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <header>
        <h1>数论百科</h1>
        <p class="tagline">从经典定理到高效算法，系统掌握数论</p>
        <p class="subtitle">Encyclopedia of Number Theory</p>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="搜索定理、术语或公式...">
        </div>
        <div id="entryCount" class="entry-count">已收录 0 项</div>
    </header>

    <main>
        <section class="chart-section" aria-labelledby="chartTitle">
            <div class="chart-head">
                <h2 id="chartTitle">质数分布可视化</h2>
                <div class="chart-tabs" role="tablist" aria-label="切换图表类型">
                    <button type="button" class="chart-tab active" data-view="spiral" role="tab" aria-selected="true">质数螺旋</button>
                    <button type="button" class="chart-tab" data-view="curve" role="tab" aria-selected="false">增长曲线</button>
                </div>
            </div>

            <p class="chart-desc" id="chartDesc">
                乌拉姆螺旋：把正整数按螺旋排列，质数会沿对角线聚成明显的线条，直观揭示质数分布中的隐藏规律。
            </p>

            <div class="chart-controls" id="spiralControls">
                <label for="spiralSize">边长：<span id="spiralSizeValue">101</span></label>
                <input type="range" id="spiralSize" min="31" max="301" step="2" value="101">
            </div>
            <div class="chart-controls" id="curveControls" hidden>
                <label for="primeRange">范围 N：<span id="primeRangeValue">1000</span></label>
                <input type="range" id="primeRange" min="100" max="1000000" step="100" value="1000">
                <button type="button" id="resetChart">重置</button>
            </div>

            <div class="chart-canvas-wrap">
                <canvas id="primeChart" width="900" height="460" aria-label="质数分布图表"></canvas>
                <div class="chart-tooltip" id="chartTooltip" hidden></div>
            </div>

            <div class="chart-stats" id="chartStats"></div>
        </section>

        <div class="grid-heading">
            <h2>知识库</h2>
            <p class="grid-sub">按难度从低到高排列，共收录 42 项</p>
        </div>

        <section class="theorem-grid" id="theoremGrid">
            <p style="text-align:center; grid-column: 1/-1;">正在加载定理库...</p>
        </section>
    </main>

    <footer>
        <p>© 2026 数论百科 | 构建于 GitHub Pages</p>
    </footer>

    <script src="script.js"></script>
    <script src="chart.js"></script>
</body>
</html>
